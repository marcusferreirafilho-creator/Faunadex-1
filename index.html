<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Faunadex Arena</title>
    <style>
        body {
            background-color: #1a1a2e;
            /* Fundo noturno */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Tela inteira */
            margin: 0;
        }

        /* Apenas cores temporárias para enxergarmos as caixas */
        .arena {
            background-color: #16213e;
            padding: 20px;
        }

        .mao-aliado {
            border: 2px solid green;
        }

        .tabuleiro {
            border: 2px solid blue;
        }

        .mao-inimigo {
            border: 2px solid red;
        }

        .arena {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;

            /* O SEGREDO DO ARQUITETO */
            display: grid;
            /* Eu quero 3 colunas: A primeira com 150px, a do meio com 450px e a última com 150px */
            grid-template-columns: 150px 450px 150px;
            gap: 40px;
            /* Um corredor de 40px separando as colunas */

            /* Ajuste para evitar o esmagamento das cartas na vertical */
            height: 600px;
        }

        /* Transformando a Mão em um Grid de 5 linhas */
        .mao-aliado,
        .mao-inimigo {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            /* 5 linhas dividindo a altura por igual */
            gap: 15px;
            border: none;
            /* Tirando a borda feia do Passo 1 */
        }

        /* Desenhando a Carta - ATUALIZADO */
        .carta {
            /* Tira o background azul e coloca a imagem via URL! */
            background-image: url('https://placebear.com');
            background-size: cover;
            /* Faz a foto preencher a carta toda */
            background-position: center;

            border: 2px solid #4CAF50;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: transparent;
            /* Esconde o texto provisório */
            cursor: pointer;
            transition: transform 0.2s;
            /* Animação suave */
        }

        /* Efeito de Hover (passar o mouse) */
        .carta:hover {
            transform: scale(1.1);
            /* A carta cresce um pouquinho! */
            border-color: yellow;
        }

        /* Cartas do Inimigo puxam outra imagem */
        .inimigo {
            background-image: url('https://placebear.com');
            border-color: #e94560;
        }

        /* Cartas do Inimigo ficam vermelhas */
        .inimigo {
            border-color: #e94560;
            color: #e94560;
        }

        .tabuleiro {
            display: grid;
            /* Magia Pura: 3 colunas iguais, 3 linhas fluidas iguais */
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;

            background-color: #0d1b2a;
            border: 3px solid #e94560;
            border-radius: 10px;
            padding: 15px;
        }

        .slot {
            background-color: #1b263b;
            border: 1px solid #415a77;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        /* Efeito ao passar o mouse */
        .slot:hover {
            background-color: #4CAF50;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- A CAIXA PAI (Onde tudo acontece) -->
    <div class="arena">

        <div class="mao-aliado">

        </div>

        <div class="tabuleiro">
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
        </div>

        <div class="mao-inimigo">

        </div>

    </div> <!-- Fim da Arena -->

    <!-- CÉREBRO DO JOGO -->
    <script>
        // Nosso Banco de Dados de Animais Aliados (Usando links web para não falhar imagens)
        const bancoDeCartasAliadas = [
            { id: 1, nome: "Urso Alpha", forca: 8, img: "https://placebear.com/200/300" },
            { id: 2, nome: "Urso Beta", forca: 9, img: "https://placebear.com/200/301" },
            { id: 3, nome: "Urso Charlie", forca: 5, img: "https://placebear.com/200/302" },
            { id: 4, nome: "Urso Delta", forca: 6, img: "https://placebear.com/200/303" },
            { id: 5, nome: "Urso Echo", forca: 7, img: "https://placebear.com/200/304" }
        ];

        const maoAliado = document.querySelector('.mao-aliado');

        // O JavaScript vai ler o Banco de Dados e criar as cartas
        bancoDeCartasAliadas.forEach(cartaDado => {
            let cartaElemento = document.createElement('div');
            cartaElemento.classList.add('carta');
            cartaElemento.style.backgroundImage = `url(${cartaDado.img})`;

            // Adiciona o alerta de volta
            cartaElemento.addEventListener('click', () => {
                alert("Você clicou na carta: " + cartaDado.nome + " com força " + cartaDado.forca);
            });

            maoAliado.appendChild(cartaElemento);
        });

        // Nosso Banco de Dados de Animais Inimigos
        const bancoDeCartasInimigas = [
            { id: 1, nome: "Urso Fox", forca: 9, img: "https://placebear.com/200/305" },
            { id: 2, nome: "Urso Golf", forca: 7, img: "https://placebear.com/200/306" },
            { id: 3, nome: "Urso Hotel", forca: 6, img: "https://placebear.com/200/307" },
            { id: 4, nome: "TUrso India", forca: 5, img: "https://placebear.com/200/308" },
            { id: 5, nome: "Urso Juliet ", forca: 8, img: "https://placebear.com/200/309" }
        ];

        const maoInimigo = document.querySelector('.mao-inimigo');

        bancoDeCartasInimigas.forEach(cartaDado => {
            let cartaElemento = document.createElement('div');
            cartaElemento.classList.add('carta');
            cartaElemento.classList.add('inimigo');
            cartaElemento.style.backgroundImage = `url(${cartaDado.img})`;

            cartaElemento.addEventListener('click', () => {
                alert("Você clicou na carta inimiga: " + cartaDado.nome + " com força " + cartaDado.forca);
            });

            maoInimigo.appendChild(cartaElemento);
        });

    </script>
</body>

</html>
